# СЕКРЕТЫ. Скопируйте этот файл в secrets.toml и заполните нужные разделы.
# secrets.toml уже в .gitignore — в репозиторий он не попадёт.
#
# Любое значение можно задать переменной окружения:
#   SP_TELEGRAM_BOT_TOKEN, SP_VK_ACCESS_TOKEN, SP_YOUTUBE_CLIENT_ID и т.д.

[telegram]
# Токен от @BotFather: /newbot
bot_token = ""
# @имя_канала или числовой id (-1001234567890). Бот должен быть админом канала.
chat_id = ""

[vk]
# Ключ доступа: dev.vk.com → ваше Standalone-приложение → «Получить токен»
# (права: wall, photos, video, offline). Для сообщества — токен сообщества.
access_token = ""
# Числовой id сообщества БЕЗ минуса. Пусто = публиковать на личную страницу.
group_id = ""

[youtube]
# Либо два поля ниже, либо положите client_secret.json рядом с этим файлом.
client_id = ""
client_secret = ""

[rutube]
# X-AUTH-TOKEN из личного кабинета (API-доступ Rutube выдаёт по запросу)
token = ""
channel_id = ""
