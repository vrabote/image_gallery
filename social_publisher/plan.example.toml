# Пример плана публикаций.
# Формат: TOML. Можно и JSON (plan.json) — ключи те же.
#
# Запуск:
#   python -m social_publisher plan social_publisher/plan.example.toml
#   python -m social_publisher run  social_publisher/plan.example.toml --dry-run
#   python -m social_publisher run  social_publisher/plan.example.toml
#
# Пути к файлам считаются от папки, где лежит этот файл.

[defaults]
# Площадки по умолчанию для постов, где platforms не указаны
platforms = ["youtube", "vk", "telegram"]
# Общие теги
tags = ["клип", "видео", "shortfilm"]

# ---------------------------------------------------------------------------
# Пост 1: вертикальный клип из папки video_prep
# ---------------------------------------------------------------------------
[[posts]]
id = "clip-stickers-01"
title = "Клип: хрупкое — не кантовать"
description = """Короткий клип про то, как важно аккуратно обращаться с хрупкими вещами.
Съёмка и монтаж — своими руками, звук — отдельная дорожка."""
tags = ["клип", "вертикальное", "хрупкое"]
platforms = ["youtube", "vk", "telegram", "rutube", "tiktok"]
category = "Клипы"           # используется для плейлиста YouTube
media = ["../video_prep/final_video.mp4"]

# ---------------------------------------------------------------------------
# Пост 2: фото в картинную галерею (описание картин + теги)
# ---------------------------------------------------------------------------
[[posts]]
id = "gallery-batch-01"
title = "Подборка: фактуры и свет"
description = """Три кадра из одной прогулки: фактуры, свет и немного случайности."""
tags = ["фото", "галерея", "свет"]
platforms = ["vk", "telegram"]
media = [
  { file = "../uploads/test.jpg", caption = "Кадр 1 — мягкий свет из окна" },
  "../video_prep/00_clean_base.jpg",
]

